version: 2
sources:
  - name: raw
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have on row per product_id found in each orders_id
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: foreign key to ship
          - name: pdt_id
            description: foreign key to product
        freshness:
              warn_after:
                count: 6
                period: hour
              error_after:
                count: 90
                period: day
                loaded_at_field: date_date
          - name: revenue
            description: the amont paid by customer to pourchase the product, revenue = quantiy * selling_price
          - name: quantity
            description: number of product purchase by customer
      - name: product
        identifier: raw_gz_product
        description: product of Greenweez / we have on row per product_id found in each orders_id
        columns:
          - name: products_id
            description: foreign key to product
        tests:
           - unique
           - not_null
           - name: purchse_price 
              description: selling price of products
      - name: ship
        identifier: raw_gz_ship
        description: ship of Greenweez
        columns:
          - name: orders_id
            description: foreign key to ship
          - name: shipping_fee
            description: price of shipping
          - name: logcost
            description: price of logistic
          - name: ship_cost
            description: sum of shipping_fee + logcost
